name: docker-publish

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - 'docs/**'
      - '**.md'

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-publish-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/koydas/ollama-chat:${{ steps.vars.outputs.sha }}
            ghcr.io/koydas/ollama-chat:latest

      # Bumping the tag here (rather than leaving the Deployment on :latest)
      # is what makes this a Git commit ArgoCD can actually sync on --
      # see docs/adr/0006.
      - name: Update deployment image tag
        run: |
          sed -i "s|ghcr.io/koydas/ollama-chat:.*|ghcr.io/koydas/ollama-chat:${{ steps.vars.outputs.sha }}|" k8s/deployment.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --cached --quiet || git commit -m "chore: deploy ${{ steps.vars.outputs.sha }}"
          git push
