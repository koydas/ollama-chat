name: e2e

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'k8s/**'
      - 'docs/**'
      - '**.md'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx vitest run server/index.e2e.test.js
