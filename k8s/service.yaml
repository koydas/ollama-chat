apiVersion: v1
kind: Service
metadata:
  name: ollama-chat
  annotations:
    # Dedicated MetalLB IP for zero-config access (no /etc/hosts entry
    # needed), alongside the Ingress. Next free slot after .240 (argocd),
    # .241 (ollama), .242 (grafana), .243 (ingress-nginx) -- see docs/adr/0007.
    metallb.io/loadBalancerIPs: "192.168.1.244"
spec:
  type: LoadBalancer
  selector:
    app: ollama-chat
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: 8443
